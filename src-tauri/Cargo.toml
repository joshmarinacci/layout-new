[package]
name = "layout-new"
version = "1.0.0"
description = "Layout 2D Editor"
authors = ["Josh"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "layout_new_lib"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Already in the dependency tree through Tauri (tao/muda); used to hand edit
# shortcuts back to the focused text field.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
